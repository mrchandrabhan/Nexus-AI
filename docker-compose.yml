services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexus
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nexus_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 15

  rag:
    build:
      context: ../agentic-rag-docqa
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "7861"]
    environment:
      EMBEDDER: minilm
      RAG_UPLOAD_DIR: /data/uploads
      MODEL_CACHE: /data/models
      RAG_QUERY_LOG: /data/logs/nexus-queries.jsonl
    ports:
      - "127.0.0.1:7861:7861"
    volumes:
      - rag_uploads:/data/uploads
      - rag_models:/data/models
      - rag_logs:/data/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7861/ready', timeout=5).read()"
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nexus:nexus_dev_password@db:5432/nexus
      CORS_ORIGINS: http://localhost:3000
      RAG_API_BASE_URL: http://rag:7861
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      rag:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  nexus_db_data:
  rag_uploads:
  rag_models:
  rag_logs:
